name: Windows Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Generate platform icons
        run: npm run tauri icon src-tauri/icons/dayforge.svg

      - name: Prepare fixed WebView2 Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '151.0.4129.93'
          $expectedSha256 = '1cb7106545f5aee92ee16496347a0e775a351cb5a3816d072f04323695899bde'
          $cab = Join-Path $env:RUNNER_TEMP 'Microsoft.WebView2.FixedVersionRuntime.x64.cab'
          $extractRoot = Join-Path $env:GITHUB_WORKSPACE 'src-tauri\WebView2FixedExtract'
          $fixedRoot = Join-Path $env:GITHUB_WORKSPACE 'src-tauri\FixedWebView2'
          $url = "https://github.com/libnyanpasu/webview2-runtime-archive/releases/download/$version/Microsoft.WebView2.FixedVersionRuntime.x64.cab"

          Invoke-WebRequest -Uri $url -OutFile $cab
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $cab).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "WebView2 Fixed Runtime checksum mismatch. Expected $expectedSha256, got $actualSha256."
          }

          Remove-Item $extractRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $fixedRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $extractRoot | Out-Null
          New-Item -ItemType Directory -Path $fixedRoot | Out-Null

          & expand.exe $cab -F:* $extractRoot | Out-Host
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to expand WebView2 Fixed Runtime cabinet."
          }

          $runtimeExe = Get-ChildItem $extractRoot -Recurse -File -Filter 'msedgewebview2.exe' | Select-Object -First 1
          if (-not $runtimeExe) {
            throw "msedgewebview2.exe was not found after extracting the fixed runtime."
          }

          Copy-Item -Path (Join-Path $runtimeExe.Directory.FullName '*') -Destination $fixedRoot -Recurse -Force
          if (-not (Test-Path (Join-Path $fixedRoot 'msedgewebview2.exe'))) {
            throw "FixedWebView2 was not prepared correctly."
          }

          Remove-Item $extractRoot -Recurse -Force
          Write-Host "Prepared WebView2 Fixed Runtime $version from verified archive asset."

      - name: Build Dayforge installer
        run: npm run tauri build

      - name: Prepare lightweight update patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patchRoot = Join-Path $env:RUNNER_TEMP 'Dayforge-Windows-Update-Patch'
          Remove-Item $patchRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $patchRoot | Out-Null

          $builtExe = Join-Path $env:GITHUB_WORKSPACE 'src-tauri\target\release\dayforge.exe'
          if (-not (Test-Path $builtExe -PathType Leaf)) {
            throw "Release executable not found: $builtExe"
          }

          Copy-Item $builtExe (Join-Path $patchRoot 'dayforge.exe') -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'scripts\windows\Apply-Dayforge-Update.ps1') (Join-Path $patchRoot 'Apply-Dayforge-Update.ps1') -Force

          @'
          @echo off
          setlocal
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Apply-Dayforge-Update.ps1"
          if errorlevel 1 (
            echo.
            echo Update failed. Your existing Dayforge installation and data were left in place.
            pause
          )
          '@ | Set-Content -Path (Join-Path $patchRoot 'Apply-Dayforge-Update.cmd') -Encoding ascii

          @'
          DAYFORGE UPDATE PATCH

          1. Keep Dayforge installed. Do not uninstall it.
          2. Extract this ZIP somewhere outside the Dayforge install folder.
          3. Double-click Apply-Dayforge-Update.cmd.
          4. The patch closes Dayforge, replaces only dayforge.exe, keeps a .bak backup,
             leaves the existing SQLite data untouched, and starts Dayforge again.

          This patch expects the existing FixedWebView2 folder from your current installation.
          '@ | Set-Content -Path (Join-Path $patchRoot 'UPDATE-INSTRUCTIONS.txt') -Encoding utf8

      - name: Upload update patch
        uses: actions/upload-artifact@v4
        with:
          name: Dayforge-Windows-Update-Patch
          path: ${{ runner.temp }}/Dayforge-Windows-Update-Patch
          if-no-files-found: error
          retention-days: 14

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: Dayforge-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
